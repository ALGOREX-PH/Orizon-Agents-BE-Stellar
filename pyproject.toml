# Lint configuration only — packaging stays requirements.txt-based and pytest
# keeps its config in pytest.ini.
[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

# Demo kits embed long literal payload strings (HTML/JS artifacts); wrapping
# them would corrupt the demo content.
[tool.ruff.lint.per-file-ignores]
"app/demo_kits/kits/*" = ["E501"]
