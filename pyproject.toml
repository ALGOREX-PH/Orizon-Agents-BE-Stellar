# Lint/type-check configuration only — packaging stays requirements.txt-based
# and pytest keeps its config in pytest.ini.
[tool.ruff]
line-length = 120

[tool.mypy]
python_version = "3.12"
files = ["app"]
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
# agno and stellar-sdk ship without stubs; don't let that block adoption.
ignore_missing_imports = true

[tool.coverage.run]
source = ["app"]
# Demo kits are embedded literal payloads, not logic.
omit = ["app/demo_kits/kits/*"]

[tool.coverage.report]
# Coverage reached 85.6% once the failure paths (step errors, settlement,
# ramp logging, proxy trust) got tests. Floor ratcheted to keep that, with
# headroom for the still-thin signing paths in app/stellar/client.py.
fail_under = 82
skip_covered = true
show_missing = true

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

# Demo kits embed long literal payload strings (HTML/JS artifacts); wrapping
# them would corrupt the demo content.
[tool.ruff.lint.per-file-ignores]
"app/demo_kits/kits/*" = ["E501"]
