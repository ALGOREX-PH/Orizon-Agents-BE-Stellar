services:
  - type: web
    name: orizon-agents-be
    runtime: python
    region: oregon
    plan: free
    branch: main
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # ── Secrets — set these in the Render dashboard, never in git ──────
      - key: OPENAI_API_KEY
        sync: false
      - key: STELLAR_SIGNING_KEY
        sync: false

      # ── HTTP ────────────────────────────────────────────────────────────
      - key: CORS_ORIGINS
        value: https://orizons.xyz,https://www.orizons.xyz,https://orizon-agents-fe-stellar.vercel.app,http://localhost:3000

      # ── Models ──────────────────────────────────────────────────────────
      - key: ORCHESTRATOR_MODEL
        value: gpt-5.3-codex
      - key: WORKER_MODEL
        value: gpt-5.3-codex

      # ── Stellar (mainnet — production) ─────────────────────────────────
      # Mainnet is the production target; testnet values live in
      # .env.example for local dev. NOTE: the Render dashboard env
      # OVERRIDES this file — paste these values there to actually
      # flip the live service. The SDF public RPC is rate-limited —
      # move to a dedicated provider at scale.
      - key: STELLAR_NETWORK
        value: mainnet
      - key: STELLAR_RPC_URL
        value: https://mainnet.sorobanrpc.com
      - key: STELLAR_NETWORK_PASSPHRASE
        value: "Public Global Stellar Network ; September 2015"
      - key: STELLAR_AGENT_REGISTRY
        value: CBTJ3BXTMTA2PQLRTSAZHEWQRTBMNHYCOKY5WOIYAH36LT4HTN63LTD4
      - key: STELLAR_REPUTATION_LEDGER
        value: CDFWQJY72GPH7PEQVFGBDZESZNVRF6LQLVWU42CFMWPGRME5RWN5AXSX
      - key: STELLAR_PAYMENT_ESCROW
        value: CBJCQBA47Q3EQ7HC46GAWJPVM7KMD5KAEI5KG4FPYJFKR3NYB4QR5CNF
      - key: STELLAR_ATTESTATION_REGISTRY
        value: CBLV6QGFCMXBXHT62JZ7YH22NXW7MVBGV6TGOGX3OHY46GQGPYCTAAK4
      - key: STELLAR_ASSET_SAC
        value: CAS3J7GYLGXMF6TDJBBYYSE3HQ6BBSMLNUQ34T6TZMYMW2EVH34XOWMA
      - key: STELLAR_ADMIN_ADDRESS
        value: GA7AI5TAJEZA27I666DSJC4MUJYBEWUYNNZWPU7R2ONA7IZQVO6R5OQV

      # ── PDAX (PHP <-> crypto on/off-ramp) ──────────────────────────────
      # Staging requires your Render outbound IPs be whitelisted by PDAX.
      - key: PDAX_ENVIRONMENT
        value: stage
      - key: PDAX_USERNAME
        sync: false
      - key: PDAX_PASSWORD
        sync: false
      - key: PDAX_OTP_SECRET
        sync: false
      - key: PDAX_WEBHOOK_SECRET
        sync: false
